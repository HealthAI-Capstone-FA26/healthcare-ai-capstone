name: E2E - WF-03 Lab testing and ECG anomaly detection

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # E2E_DATABASE_URL là biến bắt buộc của test (chống chạy nhầm lên DB dev/prod);
      # DATABASE_URL cho Prisma CLI (db push / db seed).
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospital_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospital_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret
      REFRESH_TOKEN_SECRET: ci-refresh-secret
      RESET_PASSWORD_SECRET: ci-reset-secret
      MAIL_FROM_EMAIL: noreply@ci.test
      BREVO_API_KEY: ci-dummy
      # WF-03 tải tín hiệu ECG và ảnh X-quang lên object storage qua S3 (Supabase Storage).
      S3_ENDPOINT: https://gljqmokmvcyararjgugt.storage.supabase.co/storage/v1/s3
      S3_PUBLIC_URL: https://gljqmokmvcyararjgugt.supabase.co/storage/v1/object/public/capstone
      S3_REGION: ap-south-1
      S3_BUCKET: capstone
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # prisma/migrations chỉ chứa các migration tăng dần (không có baseline) nên dựng schema bằng db push.
      - name: Create schema
        run: npx prisma db push

      - name: Seed reference data (roles, consent policies, ICD-10, service catalog, result thresholds, ECG AI model...)
        run: npx prisma db seed

      # Dùng cấu hình e2e riêng (testRegex test/e2e/*.e2e-spec.ts, maxWorkers 1) để chắc chắn chạy đúng spec e2e.
      - name: Run WF-03 full-flow e2e (DS-05 main + DS-06 exception)
        run: npx jest --config test/jest-e2e.json --runInBand --ci test/e2e/wf03-lab-testing

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-wf03-logs
          path: backend/logs/
          if-no-files-found: ignore
