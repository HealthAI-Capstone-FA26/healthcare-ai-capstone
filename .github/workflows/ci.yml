name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Cam kết: số unit test chạy trong CI = 1/2 tổng unit test (danh sách spec: backend/test/ci/unit-ci-manifest.json).
      - name: Enforce CI unit tests = 1/2 total unit tests
        run: node scripts/check-ci-ratio.js

      - name: Run unit tests (CI subset)
        run: npx jest --config jest.ci.config.js --runInBand --ci

      - name: Build
        run: npm run build
